<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghost</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="palette-wrapper">
    <!-- Single Top Command Bar -->
    <div class="bar-container" id="bar-container">
      <div class="drag-handle" title="Drag to move">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="9" cy="6" r="1.5" fill="currentColor"></circle>
          <circle cx="15" cy="6" r="1.5" fill="currentColor"></circle>
          <circle cx="9" cy="12" r="1.5" fill="currentColor"></circle>
          <circle cx="15" cy="12" r="1.5" fill="currentColor"></circle>
          <circle cx="9" cy="18" r="1.5" fill="currentColor"></circle>
          <circle cx="15" cy="18" r="1.5" fill="currentColor"></circle>
        </svg>
      </div>

      <input 
        type="text" 
        id="command-input" 
        placeholder="Tell me what to do..." 
        autocomplete="off" 
        spellcheck="false" 
        autofocus
      />

      <div class="action-badge" id="action-badge" title="Send (Enter)">
        <span id="badge-text">&gt;</span>
      </div>
    </div>

    <!-- Conversational Stream Area -->
    <div class="dynamic-content hidden" id="dynamic-content">
      <div class="chat-stream" id="chat-stream">
        <!-- Messages appended dynamically -->
      </div>

      <!-- Footer Help Hint -->
      <div class="content-footer" id="content-footer">
        <span class="footer-tip">Esc dismiss &bull; Ctrl+H history &bull; Ctrl+L clear</span>
      </div>
    </div>

    <!-- History Drawer Overlay (Ctrl + H) -->
    <div class="history-drawer hidden" id="history-drawer">
      <div class="drawer-header">
        <span class="drawer-title">Chat History</span>
        <button class="drawer-close" id="btn-close-drawer" title="Close (Esc)">&#x2715;</button>
      </div>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
